<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Binance futures tarayıcısı: hacim patlaması, fiyat/hacim anomalisi, golden cross, RSI, open interest ve funding rate." />
    <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>CoinTRK</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      try {
        var t =
          localStorage.getItem('cointrk.theme') ||
          localStorage.getItem('turcoin.theme') ||
          localStorage.getItem('cointest.theme') ||
          localStorage.getItem('coinscanner.theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>CoinTRK'yı kullanmak için JavaScript'i etkinleştirin.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
